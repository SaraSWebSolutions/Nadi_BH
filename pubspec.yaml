name: nadi_user_app
description: "A new Flutter project."
publish_to: "none"

# App Version
version: 1.0.1+12

# -----------------------------------------------------------------------------
# 🌐 Environment Configuration
# -----------------------------------------------------------------------------
environment:
  sdk: ^3.9.2

# -----------------------------------------------------------------------------
# 📦 Application Dependencies
# -----------------------------------------------------------------------------
dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:   # ✅ ADD HERE
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.0.0
  pinput: ^6.0.1
  pie_chart: ^5.4.0
  dio: ^5.9.0
  image_picker: ^1.2.1
  cached_network_image: ^3.4.1
  flutter_riverpod: ^3.0.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.4
  shimmer: ^3.0.0
  firebase_core: ^4.3.0
  firebase_messaging: ^16.1.0
  record: ^6.1.2
  permission_handler: ^12.0.1
  path_provider: ^2.1.5
  audioplayers: ^6.5.1
  permission_handler_platform_interface: ^4.3.0
  intl: ^0.20.2
  flutter_launcher_icons: ^0.14.4
  video_player: ^2.10.1
  flutter_local_notifications: ^17.0.0
  logger: ^2.6.2
  flutter_svg: ^2.2.3
  flutter_staggered_animations: ^1.1.1
  url_launcher: ^6.3.2
  carousel_slider: ^5.1.1
  # socket_io_client: ^3.1.4
  socket_io_client: ^2.0.3
  connectivity_plus: ^7.0.0
  stream_chat_flutter: ^9.23.0
  mqtt_client: ^10.0.0
  file_picker: ^10.3.10
  app_badge_plus: ^1.1.3 
  media_kit_libs_windows_video: ^1.0.0
 

# -----------------------------------------------------------------------------
# 🛠 Dev Dependencies
# -----------------------------------------------------------------------------
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.7

# -----------------------------------------------------------------------------
# 🚀 APP LAUNCHER ICON CONFIGURATION  ✅ (ADDED)
# -----------------------------------------------------------------------------
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/Applogo.png"

# -----------------------------------------------------------------------------
# 🌊 NATIVE SPLASH CONFIGURATION
# -----------------------------------------------------------------------------
flutter_native_splash:
  color: "#0D5F48"
  image: assets/logo/logo.png
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: center
  android_12:
    color: "#0D5F48"
    icon_background_color: "#0D5F48"  
    image: assets/logo/logo.png

# -----------------------------------------------------------------------------
# 🎨 Flutter Assets & Fonts
# -----------------------------------------------------------------------------
flutter:
  generate: true   # ✅ ADD THIS LINE
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/welcome_bg.png
    - assets/images/onboarding/
    - assets/logo/logo.png
    - assets/icons/
    - assets/logo/
    - assets/animations/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
